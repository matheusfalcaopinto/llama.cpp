[project]
name = "system1-studio"
version = "0.2.0"
description = "Local and LAN vehicle categorization for Brazilian toll profiles"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "python-multipart>=0.0.20,<1",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
